<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071523"><title>PELOCO RUN V12</title><style>:root{--navy:#071523;--gold:#ffd35a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111d;font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;touch-action:none}button{font:inherit}#app{height:100svh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid rgba(255,255,255,.08);background:#06111d;z-index:30}.brand{font-weight:1000;letter-spacing:.14em;color:var(--gold);font-size:13px}.iconbtn{width:42px;height:42px;border:1px solid rgba(255,255,255,.12);border-radius:50%;background:#0b2235;color:#fff}.game{position:relative;overflow:hidden;min-height:0;background:linear-gradient(#62c7ff 0 48%,#dff2bf 48% 65%,#4f8f3d 65% 68%,#77513a 68% 100%)}.layer{position:absolute;inset:0;pointer-events:none}.skyGlow{background:radial-gradient(circle at 78% 16%,rgba(255,238,149,.95) 0 7%,rgba(255,238,149,0) 18%)}.cityfar{bottom:32%;top:auto;height:45%;background:repeating-linear-gradient(90deg,rgba(68,116,150,.28) 0 72px,transparent 72px 112px),linear-gradient(transparent 0 25%,rgba(92,133,154,.22) 25% 100%)}.citymid{bottom:32%;top:auto;height:28%;background:repeating-linear-gradient(90deg,transparent 0 35px,rgba(213,164,90,.92) 35px 150px,transparent 150px 190px);opacity:.95}.roadline{position:absolute;left:0;right:0;bottom:8%;height:10px;background:repeating-linear-gradient(90deg,#4b311f 0 44px,transparent 44px 80px);opacity:.8}.hud{position:absolute;left:10px;right:10px;top:10px;z-index:12;display:flex;gap:7px;align-items:center;pointer-events:none}.hudbox{background:rgba(5,20,33,.92);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:7px 10px;min-width:86px}.hudbox span{display:block;font-size:8px;color:#a5b7c6;font-weight:900;letter-spacing:.12em}.hudbox strong{display:block;color:var(--gold);font-family:ui-monospace,SFMono-Regular,monospace;font-size:18px;margin-top:2px}.hearts{margin-left:auto;background:rgba(5,20,33,.92);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:8px 11px;color:#ff5367;font-size:23px;letter-spacing:2px}.playfield{position:absolute;inset:0;overflow:hidden;touch-action:none}.runner{position:absolute;left:13%;bottom:32%;width:108px;height:165px;z-index:8;transform-origin:50% 100%;filter:drop-shadow(0 12px 10px rgba(0,0,0,.28));will-change:transform}.runner img{width:100%;height:100%;object-fit:contain;display:block}.runner.running{animation:runBob .32s ease-in-out infinite alternate}.runner.hit{animation:hitFlash .12s linear 6}.coin{position:absolute;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff8b9 0 14%,#ffd85f 15% 42%,#ecad21 43% 100%);border:3px solid #fff1a3;color:#643600;font:bold 21px Georgia;box-shadow:0 0 18px rgba(255,212,76,.62);z-index:5}.obstacle{position:absolute;bottom:32%;z-index:6}.crate{width:58px;height:58px;background:#94562e;border:4px solid #4d2d18;border-radius:5px}.crate:before,.crate:after{content:"";position:absolute;left:6px;right:6px;top:25px;height:5px;background:#4d2d18;transform:rotate(36deg)}.crate:after{transform:rotate(-36deg)}.log{width:92px;height:44px;background:#714225;border-radius:22px}.log:after{content:"";position:absolute;right:5px;top:5px;width:34px;height:34px;border-radius:50%;background:#a26839;border:3px solid #55331f}.spike{width:64px;height:54px;background:linear-gradient(135deg,transparent 0 24%,#d7e0e5 25% 49%,transparent 50% 54%,#b6c1c9 55% 78%,transparent 79%)}.hint{position:absolute;z-index:10;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(5,20,33,.85);border:1px solid rgba(255,255,255,.12);padding:9px 14px;border-radius:999px;color:#dce7ef;font-size:12px;white-space:nowrap;pointer-events:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:linear-gradient(rgba(2,8,13,.25),rgba(2,8,13,.72));backdrop-filter:blur(3px)}.overlay.hidden{display:none}.card{width:min(430px,94vw);background:linear-gradient(180deg,#0d2941,#071523);border:1px solid rgba(255,255,255,.13);border-radius:26px;padding:22px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.46)}.card img{width:150px;height:190px;object-fit:contain;filter:drop-shadow(0 15px 15px rgba(0,0,0,.3));margin:-10px auto 2px;display:block}.card h1{margin:0;color:var(--gold);font-size:48px;line-height:.84;letter-spacing:-.04em;text-shadow:0 5px 0 #744600}.card h2{font-size:34px;margin:4px 0 8px}.card p{color:#afc0cd;line-height:1.45;margin:10px auto 16px;max-width:330px}.primary{width:100%;border:0;border-radius:16px;padding:17px;background:linear-gradient(#ffe889,#efb62d);color:#2b1800;font-size:19px;font-weight:1000;box-shadow:0 7px 0 #855000}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.stats div{background:#071725;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px}.stats span{display:block;color:#90a5b6;font-size:9px;font-weight:900;letter-spacing:.1em}.stats strong{display:block;color:var(--gold);font-family:ui-monospace,SFMono-Regular,monospace;font-size:24px;margin-top:5px}.debug{font-size:11px;color:#71879a;margin-top:12px}.phaseflash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none;z-index:15}.phaseflash.on{animation:flash .16s ease-out}.banner{position:absolute;top:80px;left:50%;transform:translateX(-50%);z-index:15;background:rgba(5,20,33,.94);border:1px solid rgba(255,211,90,.35);color:var(--gold);padding:10px 15px;border-radius:999px;font-weight:1000;display:none}.banner.show{display:block}@keyframes runBob{to{transform:translateY(-4px) rotate(-1.5deg)}}@keyframes hitFlash{50%{opacity:.25}}@keyframes flash{from{opacity:.7}to{opacity:0}}@media(max-width:430px){.runner{width:95px;height:145px;left:12%}.hudbox{min-width:80px;padding:6px 8px}.hudbox strong{font-size:17px}.hearts{font-size:21px}.card{padding:20px}.card img{width:135px;height:172px}.card h1{font-size:43px}}</style></head><body><div id="app"><header class="top"><div class="brand">PELOCO RUN · V12</div><button id="sound" class="iconbtn" aria-label="Som">🔊</button></header><main id="game" class="game"><div class="layer skyGlow"></div><div id="far" class="layer cityfar"></div><div id="mid" class="layer citymid"></div><div class="roadline"></div><div class="hud"><div class="hudbox"><span>PONTOS</span><strong id="score">00000</strong></div><div class="hudbox"><span>MOEDAS</span><strong id="coins">0</strong></div><div class="hearts" id="hearts">♥♥♥</div></div><div id="playfield" class="playfield"><div id="runner" class="runner"><img src="assets/peloco-v12.webp" alt="PELOCO"></div></div><div class="hint">Toque no cenário para pular</div><div id="phaseflash" class="phaseflash"></div><div id="banner" class="banner">FASE 2 · TEMPLO</div><div id="start" class="overlay"><section class="card"><img src="assets/peloco-v12.webp" alt="PELOCO"><h1>PELOCO<br>RUN</h1><p>Núcleo reconstruído com asset real, pontuação por ação e colisão separada da arte.</p><button id="startBtn" class="primary">JOGAR</button><div class="debug">Ficar parado não gera pontos.</div></section></div><div id="gameover" class="overlay hidden"><section class="card"><img src="assets/peloco-v12.webp" alt="PELOCO"><h2>Fim da corrida</h2><div class="stats"><div><span>PONTOS</span><strong id="finalScore">00000</strong></div><div><span>MOEDAS</span><strong id="finalCoins">0</strong></div></div><button id="again" class="primary">JOGAR NOVAMENTE</button></section></div></main></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),game=$('game'),playfield=$('playfield'),runner=$('runner'),scoreEl=$('score'),coinsEl=$('coins'),heartsEl=$('hearts'),start=$('start'),gameover=$('gameover'),finalScore=$('finalScore'),finalCoins=$('finalCoins'),far=$('far'),mid=$('mid'),flash=$('phaseflash'),banner=$('banner');let running=false,last=0,score=0,coins=0,lives=3,vy=0,jumpY=0,onGround=true,world=0,inv=0,nextObs=.9,nextCoins=1.2,audioOn=true,audioCtx=null,phase=1;let obstacles=[],coinEls=[];const GRAV=2200,JUMP=820,BASE=250;function pad(n){return String(Math.floor(n)).padStart(5,'0')}function hud(){scoreEl.textContent=pad(score);coinsEl.textContent=coins;heartsEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}function audio(){if(!audioOn)return null;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function tone(f,d=.06,type='sine',v=.07){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d)}$('sound').onclick=e=>{e.stopPropagation();audioOn=!audioOn;$('sound').textContent=audioOn?'🔊':'🔇';if(audioOn)tone(660,.09)};function cleanup(){obstacles.forEach(o=>o.el.remove());coinEls.forEach(c=>c.el.remove());obstacles=[];coinEls=[]}function reset(){cleanup();score=0;coins=0;lives=3;vy=0;jumpY=0;onGround=true;world=0;inv=0;phase=1;nextObs=.9;nextCoins=1.15;runner.style.transform='translateY(0)';runner.classList.remove('hit');hud()}function begin(){audio();reset();running=true;start.classList.add('hidden');gameover.classList.add('hidden');runner.classList.add('running');last=performance.now();tone(420,.08);setTimeout(()=>tone(620,.1),70);requestAnimationFrame(loop)}$('startBtn').onclick=begin;$('again').onclick=begin;function jump(){if(!running||!onGround)return;onGround=false;vy=JUMP;runner.classList.remove('running');tone(780,.06,'square',.08)}playfield.addEventListener('pointerdown',e=>{e.preventDefault();audio();jump()},{passive:false});function addObstacle(){const type=Math.random()<.45?'crate':Math.random()<.72?'log':'spike',el=document.createElement('div');el.className='obstacle '+type;playfield.appendChild(el);const w=type==='crate'?58:type==='log'?92:64;obstacles.push({el,x:game.clientWidth+40,w,passed:false,hit:false})}function addCoins(){const count=4+Math.floor(Math.random()*2),base=game.clientWidth+30;for(let i=0;i<count;i++){const el=document.createElement('div');el.className='coin';el.textContent='P';playfield.appendChild(el);coinEls.push({el,x:base+i*62,y:110+Math.sin(i/(count-1)*Math.PI)*90,taken:false})}}function hitbox(el,shrink=0){const r=el.getBoundingClientRect();return{left:r.left+shrink,top:r.top+shrink,right:r.right-shrink,bottom:r.bottom-shrink}}function overlaps(a,b){return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top}function damage(){if(inv>0)return;lives--;inv=.95;runner.classList.add('hit');setTimeout(()=>runner.classList.remove('hit'),700);tone(125,.14,'sawtooth',.12);hud();if(lives<=0)end()}function end(){running=false;runner.classList.remove('running');finalScore.textContent=pad(score);finalCoins.textContent=coins;gameover.classList.remove('hidden');tone(150,.15,'sawtooth',.1);setTimeout(()=>tone(105,.22,'sawtooth',.07),110)}function phaseCheck(){const np=score>=500?3:score>=200?2:1;if(np===phase)return;phase=np;banner.textContent=phase===2?'FASE 2 · TEMPLO':'FASE 3 · MONTANHA';banner.classList.add('show');flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');setTimeout(()=>banner.classList.remove('show'),1100);tone(640,.12,'triangle',.1)}function loop(t){if(!running)return;const dt=Math.min(.032,(t-last)/1000||0);last=t;const speed=BASE+Math.min(score*.18,120);world+=speed*dt;far.style.transform=`translateX(${-((world*.08)%112)}px)`;mid.style.transform=`translateX(${-((world*.18)%190)}px)`;if(!onGround){vy-=GRAV*dt;jumpY+=vy*dt;if(jumpY<=0){jumpY=0;vy=0;onGround=true;runner.classList.add('running')}runner.style.transform=`translateY(${-jumpY}px) rotate(${Math.max(-8,Math.min(8,-vy/120))}deg)`}else runner.style.transform='translateY(0)';inv=Math.max(0,inv-dt);nextObs-=dt;nextCoins-=dt;if(nextObs<=0){addObstacle();nextObs=1.25+Math.random()*.7}if(nextCoins<=0){addCoins();nextCoins=2+Math.random()*1.1}const rr=hitbox(runner,20);for(const o of obstacles){o.x-=speed*dt;o.el.style.left=o.x+'px';if(!o.passed&&o.x+o.w<rr.left){o.passed=true;if(!o.hit){score+=25;tone(420,.035,'triangle',.035)}}if(!o.hit&&inv<=0&&overlaps(rr,hitbox(o.el,5))){o.hit=true;o.el.style.opacity=.25;damage()}}obstacles=obstacles.filter(o=>{if(o.x<-120){o.el.remove();return false}return true});for(const c of coinEls){c.x-=speed*dt;c.el.style.left=c.x+'px';c.el.style.bottom=`calc(32% + ${c.y}px)`;if(!c.taken&&overlaps(rr,hitbox(c.el,4))){c.taken=true;c.el.remove();coins++;score+=10;tone(900+(coins%5)*30,.05,'sine',.065)}}coinEls=coinEls.filter(c=>!c.taken&&c.x>-70);phaseCheck();hud();requestAnimationFrame(loop)}hud();})();</script></body></html>
