<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071523"><title>PELOCO RUN — Core Playable</title><style>:root{--navy:#071523;--gold:#ffd35a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111d;font-family:Inter,system-ui,-apple-system,sans-serif;color:#fff;touch-action:none}#app{height:100svh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#06111d;border-bottom:1px solid rgba(255,255,255,.08);z-index:20}.brand{font-weight:1000;letter-spacing:.16em;color:var(--gold);font-size:14px}.audio{border:1px solid rgba(255,255,255,.12);width:42px;height:42px;border-radius:50%;background:#0b2235;color:#fff;font-size:18px}.game{position:relative;min-height:0;overflow:hidden;background:#78cffa}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;left:12px;right:12px;top:12px;z-index:5;display:flex;align-items:center;gap:8px;pointer-events:none}.pill{background:rgba(5,20,33,.9);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 11px;min-width:84px}.pill span{display:block;font-size:9px;color:#9fb1c0;font-weight:900;letter-spacing:.12em}.pill strong{display:block;color:var(--gold);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;margin-top:2px}.hearts{margin-left:auto;background:rgba(5,20,33,.9);padding:8px 11px;border-radius:14px;font-size:24px;letter-spacing:2px;color:#ff4a60;border:1px solid rgba(255,255,255,.12)}.tip{position:absolute;z-index:5;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(5,20,33,.84);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 16px;color:#d7e2ea;font-size:13px;white-space:nowrap;pointer-events:none}.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:linear-gradient(rgba(3,10,16,.22),rgba(3,10,16,.74));backdrop-filter:blur(2px)}.overlay.hidden{display:none}.card{width:min(440px,94vw);background:linear-gradient(180deg,#0d2941,#071523);border:1px solid rgba(255,255,255,.13);border-radius:28px;padding:24px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45)}.card .peloco{width:168px;max-width:54vw;height:auto;filter:drop-shadow(0 16px 18px rgba(0,0,0,.28));margin:-4px auto 6px;display:block}.card h1{margin:0;font-size:clamp(44px,12vw,74px);line-height:.85;color:var(--gold);letter-spacing:-.055em;text-shadow:0 5px 0 #7d4b00}.card h2{margin:4px 0 10px;font-size:34px}.card p{margin:8px auto 18px;color:#b4c3ce;line-height:1.45;max-width:330px}.primary{width:100%;border:0;border-radius:16px;padding:17px 18px;background:linear-gradient(#ffe785,#efb72f);color:#2a1800;font-size:19px;font-weight:1000;box-shadow:0 7px 0 #875100}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.stats div{background:#071725;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px}.stats span{display:block;color:#91a7b8;font-size:10px;font-weight:900;letter-spacing:.1em}.stats strong{display:block;color:var(--gold);font-family:ui-monospace,SFMono-Regular,monospace;font-size:24px;margin-top:4px}.small{font-size:12px!important;color:#7f95a7!important;margin-top:10px!important}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}</style></head><body><div id="app"><header class="top"><div class="brand">PELOCO RUN · CORE</div><button id="audioBtn" class="audio">🔊</button></header><main id="game" class="game"><canvas id="canvas"></canvas><div class="hud"><div class="pill"><span>PONTOS</span><strong id="score">00000</strong></div><div class="pill"><span>MOEDAS</span><strong id="coins">0</strong></div><div class="hearts" id="hearts">♥♥♥</div></div><div class="tip">Toque para pular</div><div class="flash" id="flash"></div><div class="overlay" id="startOverlay"><section class="card"><img class="peloco" src="v11-peloco.webp" alt="PELOCO"><h1>PELOCO<br>RUN</h1><p>Agora estou isolando o núcleo do jogo: correr, pular, pegar moedas e desviar.</p><button class="primary" id="startBtn">JOGAR</button><p class="small">Pontos entram apenas por moeda coletada ou obstáculo superado.</p></section></div><div class="overlay hidden" id="endOverlay"><section class="card"><img class="peloco" src="v11-peloco.webp" alt="PELOCO"><h2>Fim da corrida</h2><div class="stats"><div><span>PONTOS</span><strong id="finalScore">00000</strong></div><div><span>MOEDAS</span><strong id="finalCoins">0</strong></div></div><button class="primary" id="againBtn">JOGAR NOVAMENTE</button></section></div></main></div><script src="v11.js" defer></script></body></html>
