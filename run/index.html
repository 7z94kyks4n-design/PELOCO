<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0a2846">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>PELOCO RUN — Preview</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-topbar">
      <a class="back" href="../#/home" aria-label="Back to PELOCO">← PELOCO</a>
      <span class="preview-badge">PRIVATE PREVIEW</span>
    </header>

    <section class="hero">
      <p class="eyebrow">PELOCO RUN</p>
      <h1>Run. Jump. Keep going.</h1>
      <p class="sub">Tap anywhere or press Space / ↑ to jump.</p>
    </section>

    <section class="game-card" aria-label="PELOCO RUN game">
      <div class="hud" aria-live="polite">
        <div><span class="hud-label">SCORE</span><strong id="score">00000</strong></div>
        <div><span class="hud-label">BEST</span><strong id="best">00000</strong></div>
        <div><span class="hud-label">COINS</span><strong id="coins">0</strong></div>
      </div>

      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="game" width="960" height="540" aria-label="PELOCO endless runner"></canvas>
        <div class="overlay" id="overlay">
          <div class="panel">
            <div class="pixel-p">P</div>
            <h2 id="overlayTitle">PELOCO RUN</h2>
            <p id="overlayText">Jump over obstacles and collect PELOCO coins.</p>
            <button id="playBtn" type="button">PLAY</button>
          </div>
        </div>
      </div>

      <div class="mobile-hint">TAP TO JUMP</div>
    </section>

    <p class="legal">Prototype only. No wallet connection. No purchases. No rewards.</p>
  </main>
  <script src="game.js" defer></script>
</body>
</html>
