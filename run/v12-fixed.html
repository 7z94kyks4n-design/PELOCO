<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071523"><title>PELOCO RUN V12</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06111d;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;touch-action:none}button{font:inherit}.app{height:100svh;display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:#06111d;border-bottom:1px solid #ffffff16}.brand{color:#ffd35a;font-weight:1000;letter-spacing:.14em;font-size:13px}.sound{width:42px;height:42px;border-radius:50%;border:1px solid #ffffff20;background:#0b2235;color:#fff}.game{position:relative;overflow:hidden;background:linear-gradient(#55c6ff 0 50%,#e6efbe 50% 66%,#4a8c3a 66% 69%,#79523a 69% 100%)}.sun{position:absolute;right:8%;top:8%;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#fff8bb,#ffd968 60%,transparent 62%)}.far,.mid{position:absolute;left:0;right:-220px;bottom:31%;pointer-events:none}.far{height:42%;opacity:.35;background:repeating-linear-gradient(90deg,#5c88a5 0 85px,transparent 85px 125px)}.mid{height:25%;background:repeating-linear-gradient(90deg,transparent 0 30px,#d6aa67 30px 155px,transparent 155px 195px);opacity:.92}.road{position:absolute;left:0;right:0;bottom:9%;height:10px;background:repeating-linear-gradient(90deg,#4b311f 0 44px,transparent 44px 78px)}.hud{position:absolute;z-index:10;top:10px;left:10px;right:10px;display:flex;gap:7px;pointer-events:none}.box{min-width:84px;background:#071725ec;border:1px solid #ffffff20;border-radius:14px;padding:7px 10px}.box span{display:block;color:#9db0c0;font-size:8px;font-weight:900;letter-spacing:.12em}.box strong{display:block;color:#ffd35a;font-family:ui-monospace,monospace;font-size:18px;margin-top:2px}.hearts{margin-left:auto;background:#071725ec;border:1px solid #ffffff20;border-radius:14px;padding:8px 11px;color:#ff5267;font-size:23px;letter-spacing:2px}.field{position:absolute;inset:0;overflow:hidden}.runner{position:absolute;left:12%;bottom:31%;width:96px;height:148px;z-index:7;transform-origin:50% 100%;filter:drop-shadow(0 12px 10px #0006)}.runner img{width:100%;height:100%;object-fit:contain;display:block}.runner.run{animation:bob .28s ease-in-out infinite alternate}.runner.hit{animation:blink .1s linear 6}.coin{position:absolute;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff9c5 0 14%,#ffd75e 15% 42%,#eba91c 43% 100%);border:3px solid #fff2a5;color:#643600;font:bold 20px Georgia;box-shadow:0 0 18px #ffd35a99;z-index:5}.obs{position:absolute;bottom:31%;z-index:6}.crate{width:58px;height:58px;background:#94562e;border:4px solid #4d2d18;border-radius:5px}.crate:before,.crate:after{content:"";position:absolute;left:7px;right:7px;top:24px;height:5px;background:#4d2d18;transform:rotate(36deg)}.crate:after{transform:rotate(-36deg)}.log{width:88px;height:42px;border-radius:22px;background:#704225}.log:after{content:"";position:absolute;right:4px;top:4px;width:34px;height:34px;border-radius:50%;background:#a36738;border:3px solid #55331f}.spike{width:62px;height:52px;background:linear-gradient(135deg,transparent 0 24%,#dbe3e8 25% 49%,transparent 50% 54%,#b9c4cb 55% 78%,transparent 79%)}.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;background:#071725dd;border:1px solid #ffffff20;border-radius:999px;padding:9px 14px;color:#d8e3eb;font-size:12px;pointer-events:none}.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:linear-gradient(#02080d44,#02080dcc);backdrop-filter:blur(3px)}.overlay.hidden{display:none}.card{width:min(420px,94vw);background:linear-gradient(#0d2941,#071523);border:1px solid #ffffff20;border-radius:26px;padding:20px;text-align:center;box-shadow:0 28px 70px #0008}.card img{width:138px;height:182px;object-fit:contain;display:block;margin:-6px auto 2px;filter:drop-shadow(0 12px 14px #0006)}.card h1{margin:0;color:#ffd35a;font-size:45px;line-height:.84;letter-spacing:-.05em;text-shadow:0 5px 0 #744600}.card h2{margin:4px 0 8px;font-size:34px}.card p{margin:10px auto 16px;max-width:320px;color:#afc0cd;line-height:1.45}.primary{width:100%;border:0;border-radius:16px;padding:17px;background:linear-gradient(#ffe889,#efb62d);color:#2b1800;font-weight:1000;font-size:19px;box-shadow:0 7px 0 #855000}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.stats div{background:#071725;border:1px solid #ffffff16;border-radius:14px;padding:12px}.stats span{display:block;color:#90a5b6;font-size:9px;font-weight:900}.stats strong{display:block;color:#ffd35a;font:700 24px ui-monospace,monospace;margin-top:5px}.note{font-size:11px;color:#758b9d;margin-top:11px}@keyframes bob{to{transform:translateY(-4px) rotate(-1deg)}}@keyframes blink{50%{opacity:.25}}</style></head><body><div class="app"><header class="top"><div class="brand">PELOCO RUN · V12</div><button id="sound" class="sound">🔊</button></header><main id="game" class="game"><div class="sun"></div><div id="far" class="far"></div><div id="mid" class="mid"></div><div class="road"></div><div class="hud"><div class="box"><span>PONTOS</span><strong id="score">00000</strong></div><div class="box"><span>MOEDAS</span><strong id="coins">0</strong></div><div id="hearts" class="hearts">♥♥♥</div></div><div id="field" class="field"><div id="runner" class="runner"><img class="peloco" alt="PELOCO"></div></div><div class="hint">Toque para pular</div><div id="start" class="overlay"><section class="card"><img class="peloco" alt="PELOCO"><h1>PELOCO<br>RUN</h1><p>Core refeito: personagem real, hitbox separada e pontuação somente por ação.</p><button id="startBtn" class="primary">JOGAR</button><div class="note">Sem ação útil = 00000 pontos.</div></section></div><div id="over" class="overlay hidden"><section class="card"><img class="peloco" alt="PELOCO"><h2>Fim da corrida</h2><div class="stats"><div><span>PONTOS</span><strong id="fScore">00000</strong></div><div><span>MOEDAS</span><strong id="fCoins">0</strong></div></div><button id="again" class="primary">JOGAR NOVAMENTE</button></section></div></main></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),game=$('game'),field=$('field'),runner=$('runner'),scoreEl=$('score'),coinsEl=$('coins'),heartsEl=$('hearts'),start=$('start'),over=$('over'),fScore=$('fScore'),fCoins=$('fCoins'),far=$('far'),mid=$('mid');let running=false,last=0,score=0,coins=0,lives=3,vy=0,jy=0,onGround=true,inv=0,nextObs=.9,nextCoin=1.2,world=0,audioOn=true,audioCtx=null,obs=[],coin=[];const GRAV=2200,JUMP=820,BASE=250;fetch('assets/peloco-v12.webp').then(r=>r.text()).then(t=>{const src='data:image/webp;base64,'+t.trim();document.querySelectorAll('.peloco').forEach(i=>i.src=src)}).catch(()=>{document.querySelectorAll('.peloco').forEach(i=>i.alt='PELOCO indisponível')});function pad(n){return String(Math.floor(n)).padStart(5,'0')}function hud(){scoreEl.textContent=pad(score);coinsEl.textContent=coins;heartsEl.textContent='♥'.repeat(lives)+'♡'.repeat(3-lives)}function audio(){if(!audioOn)return null;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function tone(f,d=.06,type='sine',v=.07){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d)}$('sound').onclick=e=>{e.stopPropagation();audioOn=!audioOn;$('sound').textContent=audioOn?'🔊':'🔇';if(audioOn)tone(660,.09)};function clear(){obs.forEach(o=>o.el.remove());coin.forEach(c=>c.el.remove());obs=[];coin=[]}function reset(){clear();score=0;coins=0;lives=3;vy=0;jy=0;onGround=true;inv=0;nextObs=.9;nextCoin=1.15;world=0;runner.style.transform='translateY(0)';runner.className='runner';hud()}function begin(){audio();reset();running=true;start.classList.add('hidden');over.classList.add('hidden');runner.classList.add('run');last=performance.now();tone(420,.08);setTimeout(()=>tone(620,.1),70);requestAnimationFrame(loop)}$('startBtn').onclick=begin;$('again').onclick=begin;function jump(){if(!running||!onGround)return;onGround=false;vy=JUMP;runner.classList.remove('run');tone(780,.06,'square',.08)}field.addEventListener('pointerdown',e=>{e.preventDefault();audio();jump()},{passive:false});function mkObs(){const type=Math.random()<.45?'crate':Math.random()<.72?'log':'spike',el=document.createElement('div');el.className='obs '+type;field.appendChild(el);obs.push({el,x:game.clientWidth+40,w:type==='crate'?58:type==='log'?88:62,passed:false,hit:false})}function mkCoins(){const n=4+Math.floor(Math.random()*2),b=game.clientWidth+30;for(let i=0;i<n;i++){const el=document.createElement('div');el.className='coin';el.textContent='P';field.appendChild(el);coin.push({el,x:b+i*62,y:110+Math.sin(i/(n-1)*Math.PI)*90,taken:false})}}function box(el,s=0){const r=el.getBoundingClientRect();return{left:r.left+s,top:r.top+s,right:r.right-s,bottom:r.bottom-s}}function hit(a,b){return a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top}function damage(){if(inv>0)return;lives--;inv=.95;runner.classList.add('hit');setTimeout(()=>runner.classList.remove('hit'),700);tone(125,.14,'sawtooth',.12);hud();if(lives<=0)end()}function end(){running=false;runner.classList.remove('run');fScore.textContent=pad(score);fCoins.textContent=coins;over.classList.remove('hidden');tone(150,.15,'sawtooth',.1)}function loop(t){if(!running)return;const dt=Math.min(.032,(t-last)/1000||0);last=t;const speed=BASE+Math.min(score*.16,110);world+=speed*dt;far.style.transform=`translateX(${-((world*.08)%125)}px)`;mid.style.transform=`translateX(${-((world*.18)%195)}px)`;if(!onGround){vy-=GRAV*dt;jy+=vy*dt;if(jy<=0){jy=0;vy=0;onGround=true;runner.classList.add('run')}runner.style.transform=`translateY(${-jy}px) rotate(${Math.max(-7,Math.min(7,-vy/130))}deg)`}else runner.style.transform='translateY(0)';inv=Math.max(0,inv-dt);nextObs-=dt;nextCoin-=dt;if(nextObs<=0){mkObs();nextObs=1.28+Math.random()*.7}if(nextCoin<=0){mkCoins();nextCoin=2+Math.random()*1.1}const rr=box(runner,20);for(const o of obs){o.x-=speed*dt;o.el.style.left=o.x+'px';if(!o.passed&&o.x+o.w<rr.left){o.passed=true;if(!o.hit){score+=25;tone(430,.035,'triangle',.035)}}if(!o.hit&&inv<=0&&hit(rr,box(o.el,5))){o.hit=true;o.el.style.opacity=.25;damage()}}obs=obs.filter(o=>{if(o.x<-120){o.el.remove();return false}return true});for(const c of coin){c.x-=speed*dt;c.el.style.left=c.x+'px';c.el.style.bottom=`calc(31% + ${c.y}px)`;if(!c.taken&&hit(rr,box(c.el,4))){c.taken=true;c.el.remove();coins++;score+=10;tone(900+(coins%5)*30,.05,'sine',.065)}}coin=coin.filter(c=>!c.taken&&c.x>-70);hud();requestAnimationFrame(loop)}hud();})();</script></body></html>
