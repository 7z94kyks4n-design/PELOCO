function obstacleDraw(o){if(o.k==='crate'){rr(o.x,o.y,o.w,o.h,5,'#865029','#573017',3);ctx.strokeStyle='#573017';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(o.x+8,o.y+8);ctx.lineTo(o.x+o.w-8,o.y+o.h-8);ctx.moveTo(o.x+o.w-8,o.y+8);ctx.lineTo(o.x+8,o.y+o.h-8);ctx.stroke()}else if(o.k==='log'){rr(o.x,o.y,o.w,o.h,15,'#6d4327','#492a17',3);ctx.beginPath();ctx.arc(o.x+o.w-12,o.y+o.h/2,10,0,6.283);ctx.strokeStyle='#b57945';ctx.stroke()}else if(o.k==='stone'){ctx.fillStyle='#707275';ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+8,o.y+12);ctx.lineTo(o.x+o.w*.55,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(o.x+13,o.y+12,9,5)}else{ctx.fillStyle='#69442a';ctx.fillRect(o.x+16,o.y+22,8,o.h-22);rr(o.x,o.y,o.w,28,4,'#c79d5d','#69442a',3);ctx.fillStyle='#69442a';ctx.font='900 14px system-ui';ctx.fillText('?',o.x+16,o.y+19)}}

function draw(){ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85}background();coinItems.forEach(coin);obstacles.forEach(obstacleDraw);player();particles.forEach(q=>{ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle=q.col;ctx.fillRect(q.x,q.y,q.s,q.s)});ctx.globalAlpha=1;ctx.restore()}
function loop(now){let dt=Math.min(34,now-last);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
shareBtn.addEventListener('click',async()=>{let s=pad(best||score),text=TXT[lang].shareText(s);try{if(navigator.share)await navigator.share({title:'PELOCO RUN',text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);showToast(TXT[lang].copied)}else showToast(text)}catch(_){}});function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}
})();
