name: Update public on-chain data

on:
  push:
    paths:
      - ".github/workflows/update-live-data.yml"
      - "tools/update_live_data.py"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peloco-live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Query and validate public data
        env:
          SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
          SOLANA_RPC_FALLBACK_URL: ${{ secrets.SOLANA_RPC_FALLBACK_URL }}
        run: |
          for attempt in 1 2; do
            python3 tools/update_live_data.py && exit 0
            if [ "$attempt" -lt 2 ]; then
              echo "Temporary data-source failure; retrying in 20 seconds."
              sleep 20
            fi
          done
          exit 1
      - name: Publish timestamped snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json data/history.json
          git diff --cached --quiet && exit 0
          git commit -m "Update public on-chain data"
          git push
