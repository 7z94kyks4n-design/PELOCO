be guaranteed; direction will be shown through actions and track record.'],['THE RULE','A fact is a fact. An indication is an indication. An interpretation is an interpretation.'],['RISKS','No promises of profit, appreciation, returns, minimum price, or absence of losses.'],['CONCLUSION','We started small. We know how we want to build: with responsibility, structure, and continuity.']]};

    function transparency(){return shell(head(lang==='pt'?'Transparência':'Transparency',lang==='pt'?'Não confie cegamente. Verifique.':'Do not trust blindly. Verify.',lang==='pt'?'Os dados abaixo são referências públicas do projeto. Não representam um painel em tempo real.':'The data below are public project references. They are not presented as a real-time dashboard.')+`<div class="stats"><div class="stat"><strong>1,000,000,000</strong><span>Supply PELOCO</span></div><div class="stat"><strong>Solana</strong><span>${lang==='pt'?'Rede':'Network'}</span></div><div class="stat"><strong>~0.96%</strong><span>${lang==='pt'?'Posição atual do criador':'Current creator position'}</span></div><div class="stat"><strong>6</strong><span>Decimals</span></div></div><div class="grid">${card('',lang==='pt'?'Existe hoje':'Exists today',lang==='pt'?'Token identificável on-chain, supply definido, presença pública, comunidade inicial e posição atual do criador.':'On-chain identifiable token, defined supply, public presence, initial community, and current creator position.',status('exists','EXISTE HOJE','EXISTS TODAY'))}${card('',lang==='pt'?'Em construção':'Being built',lang==='pt'?'Identidade, comunidade, documentação, histórico e estrutura pública de acompanhamento.':'Identity, community, documentation, track record, and a public tracking structure.',status('building','EM CONSTRUÇÃO','BEING BUILT'))}${card('',lang==='pt'?'Planejado':'Planned',lang==='pt'?'Holdings do criador abaixo de 5%, lock de 2 anos e Public Reserve abaixo de 6%. Mecanismos ainda serão divulgados.':'Creator holdings below 5%, a 2-year lock, and a Public Reserve below 6%. Mechanisms will be disclosed later.',status('planned','PLANEJADO','PLANNED'))}</div>`)}
    function building(){return shell(head(lang==='pt'?'Construção pública':'Building in public',lang==='pt'?'O que estamos construindo.':'What we are building.',lang==='pt'?'Credibilidade deve ser construída por execução e histórico — não por aparência.':'Credibility must be built through execution and track record — not appearance.')+`<div class="grid">${[['Identidade','Identity'],['Comunidade','Community'],['Presença pública','Public presence'],['Documentação','Documentation'],['Transparência','Transparency'],['Histórico','Track record']].map((x,i)=>card(String(i+1).padStart(2,'0'),x[lang==='pt'?0:1],lang==='pt'?'Desenvolvimento progressivo, público e verificável.':'Progressive, public, and verifiable development.',status('building','EM CONSTRUÇÃO','BEING BUILT'))).join('')}</div><blockquote class="quote">${lang==='pt'?'Crescimento deve ser construído, não comprado.':'Growth should be built, not bought.'}</blockquote>`)}
    function verify(){let label=lang==='pt'?'Copiar contrato':'Copy contract';return shell(head(lang==='pt'?'Verificação on-chain':'On-chain verification',lang==='pt'?'Verifique PELOCO nas fontes públicas.':'Verify PELOCO through public sources.',lang==='pt'?'Use os endereços e links oficiais abaixo. Sempre confira antes de qualquer interação.':'Use the official addresses and links below. Always check before any interaction.')+`<div class="card"><div class="data-row"><strong>Token</strong><code>${TOKEN}</code><button class="btn copy" data-copy="${TOKEN}">${label}</button></div><div class="data-row"><strong>Creator</strong><code>${CREATOR}</code><a class="btn" href="${links.creator}" target="_blank" rel="noopener">Solscan ↗</a></div><div class="data-row"><strong>Bonding curve</strong><code>${CURVE}</code><a class="btn" href="${links.curve}" target="_blank" rel="noopener">Solscan ↗</a></div></div><div class="link-list" style="margin-top:18px">${[['Pump.fun',links.pump],['DexScreener',links.dex],['Solscan — Token',links.token],['Solscan — Creator',links.creator],['Solscan — Bonding Curve',links.curve],['GitHub',links.github]].map(x=>`<a class="verify-link" href="${x[1]}" target="_blank" rel="noopener"><span>${x[0]}</span><span>↗</span></a>`).join('')}</div>`)}
    function updates(){return shell(head(lang==='pt'?'Atualizações':'Updates',lang==='pt'?'Um histórico que cresce com o projeto.':'A track record that grows with the project.',lang==='pt'?'Somente acontecimentos registrados. Sem preencher lacunas com eventos inventados.':'Recorded events only. No invented updates to fill gaps.')+`<div class="timeline">${[['DAY 1','LAUNCH'],['DAY 4','SMALL STEPS'],['DAY 6','PUBLIC SNAPSHOT']].map(x=>`<article class="card event"><div class="number">${x[0]}</div><h3>${x[1]}</h3></article>`).join('')}</div>`)}
    function flock(){return shell(head('FLOCK',lang==='pt'?'Muitas versões. Uma comunidade.':'Many versions. One community.',lang==='pt'?'A FLOCK é o universo visual do PELOCO — criado com a identidade animal no centro.':'The FLOCK is PELOCO’s visual universe — created with animal identity at its center.')+`<div class="gallery">${images.map((src,i)=>`<figure><img src="${src}" loading="lazy" alt="PELOCO FLOCK — arte ${i+1}" width="800" height="1000"></figure>`).join('')}</div>`)}
    function community(){return shell(head(lang==='pt'?'Comunidade':'Community',lang==='pt'?'A comunidade não pertence ao criador.':'The community does not belong to the creator.',lang==='pt'?'Cada pessoa é livre para analisar, questionar, acompanhar, participar — ou não participar.':'Everyone is free to analyze, question, follow, participate — or not participate.')+`<div class="grid">${card('01',lang==='pt'?'Liberdade':'Freedom',lang==='pt'?'Sem pressão e sem confiança cega. Cada decisão é individual.':'No pressure and no blind trust. Every decision is individual.')}${card('02',lang==='pt'?'Verdade':'Truth',lang==='pt'?'Não fabricamos atividade, volume, engajamento ou comunidade.':'We do not manufacture activity, volume, engagement, or community.')}${card('03',lang==='pt'?'Participação real':'Real participation',lang==='pt'?'Preferimos uma comunidade pequena e verdadeira a uma grande e artificial.':'We prefer a small, real community to a large, artificial one.')}</div><div class="actions"><a class="btn primary" href="https://t.me/pelococoin" target="_blank" rel="noopener">Telegram ↗</a><a class="btn" href="https://discord.gg/wnXxWjftUZ" target="_blank" rel="noopener">Discord ↗</a><a class="btn" href="https://x.com/PelocoCoin" target="_blank" rel="noopener">X ↗</a></div>`)}
    function vision(){return shell(head(lang==='pt'?'Visão':'Vision',lang==='pt'?'Crescer com mais responsabilidade.':'Grow with greater responsibility.',lang==='pt'?'Mais comunidade deve significar mais estrutura. Mais recursos, mais transparência. Mais visibilidade, mais cuidado.':'More community should mean more structure. More resources, more transparency. More visibility, more care.')+`<div class="grid">${card('',lang==='pt'?'Ano 1':'Year 1','1,000 holders',status('planned','META ASPIRACIONAL','ASPIRATIONAL GOAL'))}${card('',lang==='pt'?'Ano 2':'Year 2','5,000 holders',status('planned','META ASPIRACIONAL','ASPIRATIONAL GOAL'))}${card('',lang==='pt'?'Ano 3':'Year 3','12,000 holders',status('planned','META ASPIRACIONAL','ASPIRATIONAL GOAL'))}</div><blockquote class="quote">${lang==='pt'?'Esses números são metas aspiracionais — não previsões ou garantias.':'These numbers are aspirational goals — not forecasts or guarantees.'}</blockquote>`)}
    function risks(){let items=lang==='pt'?['Perda total ou parcial','Alta volatilidade','Baixa liquidez','Manipulação de mercado','Riscos técnicos e de infraestrutura','Riscos relacionados a carteiras e plataformas','Ausência de garantia de sucesso']:['Partial or total loss','High volatility','Low liquidity','Market manipulation','Technical and infrastructure risks','Wallet and platform risks','No guarantee of success'];return shell(head(lang==='pt'?'Riscos':'Risks',lang==='pt'?'Informação antes de participação.':'Information before participation.',lang==='pt'?'Memecoins são ativos altamente especulativos. PELOCO não promete lucro, valorização, retorno financeiro ou ausência de perdas.':'Memecoins are highly speculative assets. PELOCO does not promise profit, appreciation, financial returns, or absence of losses.')+`<div class="grid">${items.map((x,i)=>card(String(i+1).padStart(2,'0'),x,lang==='pt'?'Considere este risco antes de tomar qualquer decisão.':'Consider this risk before making any decision.','','')).join('')}</div><blockquote class="quote warning">${lang==='pt'?'Não prometemos risco zero. Prometemos tornar os riscos visíveis.':'We do not promise zero risk. We promise to make the risks visible.'}</blockquote>`)}
    const routes={home,idea,manifesto,transparency,building,verify,updates,flock,community,vision,risks};
    const routeKeys=['home','idea','manifesto','transparency','building','verify','updates','flock','community','vision','risks'];
    function renderNav(){const labels=copy[lang].nav;document.getElementById('mobileNav').innerHTML=routeKeys.map((r,i)=>`<a href="#/${r}" data-route="${r}">${labels[i]}</a>`).join('')}
    function render(){const route=location.hash.replace('#/','')||'home';const page=routes[route]||(()=>shell(`<div class="error"><h2>404</h2><a class="btn primary" href="#/home">PELOCO</a></div>`));document.documentElement.lang=lang==='pt'?'pt-BR':'en';document.getElementById('langCode').textContent=lang.toUpperCase();document.querySelector('[data-t="footer"]').textContent=copy[lang].footer;document.getElementById('content').innerHTML=page();document.querySelectorAll('[data-route]').forEach(a=>a.toggleAttribute('aria-current',a.dataset.route===route));document.querySelectorAll('[data-copy]').forEach(btn=>btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(btn.dataset.copy);btn.textContent=lang==='pt'?'COPIADO ✓':'COPIED ✓'}catch{btn.textContent=lang==='pt'?'SELECIONE O ENDEREÇO':'SELECT ADDRESS'}}));document.getElementById('mobileNav').classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false');window.scrollTo(0,0);document.getElementById('content').focus({preventScroll:true})}
    document.getElementById('langBtn').addEventListener('click',()=>{lang=lang==='pt'?'en':'pt';localStorage.setItem('peloco-lang',lang);renderNav();render()});
    document.getElementById('menuBtn').addEventListener('click',e=>{const nav=document.getElementById('mobileNav');nav.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',nav.classList.contains('open'))});
    window.addEventListener('hashchange',render);renderNav();if(!location.hash)history.replaceState(null,'','#/home');render();
  </script>
</body>
</html>
