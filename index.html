<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PELOCO</title>
<style>
body{margin:0;font-family:sans-serif;background:#FFFDF0;text-align:center}
header{background:#FFD400;padding:15px;border-bottom:4px solid #000;position:sticky;top:0}
h1{margin:0;font-size:30px}
.hero{background:#1a1a2e;position:relative;min-height:450px;display:flex;align-items:center;justify-content:center}
.hero img{position:absolute;width:100%;height:100%;object-fit:cover}
.hero div{position:relative;z-index:2;color:white;background:rgba(0,0,0,.5);padding:20px;border-radius:20px}
.btn{background:#FF6B35;color:white;padding:15px 30px;border-radius:50px;text-decoration:none;font-weight:bold;border:3px solid #000;display:inline-block;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;padding:20px}
.card{background:white;border:3px solid #000;border-radius:20px;overflow:hidden}
.card img{width:100%;height:200px;object-fit:cover}
</style>
</head>
<body>
<header><h1>PELOCO 🐥</h1></header>
<div class="hero">
<img id="hero" src="">
<div><h2>A MARCA DO PINTINHO</h2><a class="btn" href="#grid">VER COLEÇÃO</a></div>
</div>
<div class="grid" id="grid"></div>
<script>
fetch('https://api.github.com/repos/7z94kyks4n/PELOCO/contents').then(r=>r.json()).then(files=>{
let jpgs=files.filter(f=>f.name.toLowerCase().includes('.jp')).map(f=>f.name);
document.getElementById('hero').src=jpgs[0];
let g=document.getElementById('grid');
g.innerHTML='';
jpgs.forEach((n,i)=>{g.innerHTML+=`<div class="card"><img src="${n}"><div style="padding:10px"><b>PELUCO #${i+1}</b><br>R$ 89,90</div></div>`});
});
</script>
</body>
</html>
