<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0E27">

  <title>PELOCO — $PELOCO</title>

  <meta
    name="description"
    content="PELOCO $PELOCO — From Family to Community 🐣💛"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.08), transparent 32%),
        #0A0E27;
      color: #fff;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 16px 40px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    /* LOGO */

    .logo-wrap {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 18px auto 20px;
    }

    .logo-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #FFD700;
      filter: blur(22px);
      opacity: 0.16;
    }

    .logo {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(145deg, #FFE45C, #FFB800);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0A0E27;
      font-size: 48px;
      font-weight: 900;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 12px 35px rgba(0,0,0,0.35);
    }

    /* HEADER */

    .official {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid rgba(255,215,0,0.22);
      border-radius: 999px;
      background: rgba(255,215,0,0.06);
      color: #FFD700;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: -0.8px;
      font-weight: 900;
    }

    .ticker {
      color: #FFD700;
    }

    .tagline {
      margin: 12px 0 26px;
      color: #94A3B8;
      font-size: 13px;
      line-height: 1.5;
    }

    /* BUTTONS */

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .b {
      position: relative;
      min-height: 58px;
      width: 100%;
      padding: 0 18px;
      border-radius: 15px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;
    }

    .b:hover {
      transform: translateY(-2px);
    }

    .b:active {
      transform: translateY(0);
    }

    .gold {
      background: linear-gradient(100deg, #FFD700, #FFB800);
      color: #0A0E27;
      box-shadow: 0 10px 28px rgba(255, 190, 0, 0.16);
    }

    .gold:hover {
      box-shadow: 0 14px 32px rgba(255, 190, 0, 0.24);
    }

    .dark {
      background: rgba(19, 26, 58, 0.9);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.07);
    }

    .dark:hover {
      border-color: rgba(255,215,0,0.28);
      background: #151d42;
    }

    .arrow {
      opacity: 0.55;
      font-size: 18px;
    }

    /* CONTRACT */

    .contract-section {
      margin-top: 28px;
      text-align: left;
    }

    .contract-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 0 3px;
      color: #64748B;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .ca-box {
      background: rgba(19,26,58,0.78);
      border: 1px dashed rgba(255,255,255,0.14);
      border-radius: 13px;
      padding: 13px;
    }

    .ca {
      color: #CBD5E1;
      font-family: monospace;
      font-size: 10px;
      line-height: 1.6;
      word-break: break-all;
      text-align: center;
    }

    .copy {
      width: 100%;
      margin-top: 10px;
      border: 0;
      border-radius: 9px;
      padding: 9px;
      background: rgba(255,255,255,0.05);
      color: #94A3B8;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      transition: 0.18s ease;
    }

    .copy:hover {
      background: rgba(255,215,0,0.08);
      color: #FFD700;
    }

    /* FOOTER */

    .footer {
      margin-top: 30px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,0.06);
      color: #475569;
      font-size: 10px;
      line-height: 1.6;
    }

    .footer strong {
      color: #64748B;
    }

    /* MOBILE */

    @media (max-width: 420px) {
      body {
        padding: 18px 14px 32px;
      }

      .logo,
      .logo-wrap {
        width: 88px;
        height: 88px;
      }

      .logo {
        font-size: 42px;
      }

      h1 {
        font-size: 25px;
      }

      .b {
        min-height: 55px;
        font-size: 13px;
      }

      .ca {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <main class="box">

    <!-- LOGO -->
    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <div class="logo">P</div>
    </div>

    <!-- HEADER -->
    <div class="official">
      🐣 Official PELOCO
    </div>

    <h1>
      PELOCO <span class="ticker">$PELOCO</span>
    </h1>

    <p class="tagline">
      From Family to Community 🐣💛
    </p>

    <!-- LINKS -->
    <div class="links">

      <a
        class="b gold"
        href="https://join.pump.fun/HSag/bzak5fc1"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>🚀 BUY ON PUMP.FUN</span>
        <span class="arrow">→</span>
      </a>

      <a
        class="b dark"
        href="https://dexscreener.com/solana/HprAo1GwX5ezFSp7yaYTeAhkj5pCjXVgs2mwRXjqpump"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>📊 DEXSCREENER</span>
        <span class="arrow">→</span>
      </a>

      <a
        class="b dark"
        href="https://solscan.io/token/HprAo1GwX5ezFSp7yaYTeAhkj5pCjXVgs2mwRXjqpump"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>🔎 SOLSCAN</span>
        <span class="arrow">→</span>
      </a>

      <a
        class="b dark"
        href="https://x.com/PelocoCoin"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>🐦 X @PelocoCoin</span>
        <span class="arrow">→</span>
      </a>

    </div>

    <!-- CONTRACT -->
    <section class="contract-section">

      <div class="contract-label">
        <span>Contract Address</span>
        <span>Solana</span>
      </div>

      <div class="ca-box">

        <div class="ca" id="contract">
          HprAo1GwX5ezFSp7yaYTeAhkj5pCjXVgs2mwRXjqpump
        </div>

        <button class="copy" onclick="copyContract()">
          COPY CONTRACT ADDRESS
        </button>

      </div>

    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <strong>PELOCO $PELOCO</strong><br>
      From Family to Community 🐣💛
    </footer>

  </main>

  <script>
    function copyContract() {
      const contract =
        "HprAo1GwX5ezFSp7yaYTeAhkj5pCjXVgs2mwRXjqpump";

      const button = document.querySelector(".copy");

      navigator.clipboard.writeText(contract).then(() => {
        button.textContent = "✓ COPIED";

        setTimeout(() => {
          button.textContent = "COPY CONTRACT ADDRESS";
        }, 1800);
      });
    }
  </script>

</body>
</html>
