<html lang="en">
<head>

  <meta

    content="PELOCO — an animal-only universe built around identity, community, transparency and a journey that continues."
  />
  <meta name="robots" content="index,follow" />

  <meta property="og:title" content="PELOCO — The Journey Continues" />
  <meta
    property="og:description"
    content="Welcome to the PELOCO Universe."
  />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PELOCO — The Journey Continues" />
  <meta
    name="twitter:description"
    content="An animal-only universe built around identity, community and transparency."
  />

  <style>
    :root {
      --bg: #070a10;
      --bg-soft: #0b1019;
      --panel: rgba(15, 20, 30, 0.76);
      --panel-strong: #0e141e;
      --line: rgba(255,255,255,.08);
      --line2: rgba(255,255,255,.14);

      --text: #f6f7f9;
      --muted: #98a2b3;
      --soft: #c7d0dc;

      --yellow: #f5c542;
      --yellow-soft: rgba(245,197,66,.13);
      --yellow-line: rgba(245,197,66,.34);

      --blue: #466edc;
      --green: #55c78a;
      --red: #ff7373;

      --max: 1180px;
      --radius: 18px;
      --radius-sm: 12px;

      --shadow:
        0 24px 80px rgba(0,0,0,.34);

      --transition: 180ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(245,197,66,.11),
          transparent 28%
        ),
        radial-gradient(
          circle at 8% 35%,
          rgba(70,110,220,.08),
          transparent 25%
        ),
        var(--bg);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: .32;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 72% 15%, rgba(255,255,255,.45) 0 1px, transparent 1.5px),
        radial-gradient(circle at 35% 67%, rgba(255,255,255,.35) 0 1px, transparent 1.5px),
        radial-gradient(circle at 88% 72%, rgba(255,255,255,.4) 0 1px, transparent 1.5px);
      background-size: 240px 240px, 310px 310px, 390px 390px, 280px 280px;
    }

    ::selection {
      color: #111;
      background: var(--yellow);
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    [hidden] {
      display: none !important;
    }

    .skip-link {
      position: fixed;
      top: -100px;
      left: 16px;
      z-index: 9999;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--yellow);
      color: #111;
      font-weight: 800;
    }

    .skip-link:focus {
      top: 16px;
    }

    .container {
      width: min(calc(100% - 40px), var(--max));
      margin-inline: auto;
    }

    /* =========================
       HEADER
       ========================= */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--line);
      background: rgba(7,10,16,.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      font-weight: 900;
      letter-spacing: .08em;
      font-size: 15px;
      white-space: nowrap;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--yellow);
      color: #0b0d11;
      font-weight: 1000;
      box-shadow: 0 0 28px rgba(245,197,66,.14);
    }

    .nav {
      flex: 1;
      display: flex;
      justify-content: center;
      gap: 3px;
    }

    .nav-link,
    .mobile-link {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 700;
      transition:
        color var(--transition),
        background var(--transition);
    }

    .nav-link:hover,
    .mobile-link:hover {
      color: var(--text);
      background: rgba(255,255,255,.05);
    }

    .nav-link.active {
      color: var(--yellow);
      background: var(--yellow-soft);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-switch {
      display: flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.025);
    }

    .lang-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-radius: 7px;
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 900;
      transition: var(--transition);
    }

    .lang-btn.active {
      color: #111;
      background: var(--yellow);
    }

    .menu-btn {
      display: none;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.035);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
    }

    .mobile-menu {
      display: none;
      padding: 0 20px 18px;
      border-top: 1px solid var(--line);
    }

    .mobile-menu.open {
      display: grid;
      gap: 4px;
    }

    .mobile-link {
      width: 100%;
      text-align: left;
      padding: 12px;
    }

    /* =========================
       MAIN / VIEWS
       ========================= */

    main {
      min-height: calc(100vh - 72px);
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
      animation: pageIn .3s ease both;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .page {
      padding: 86px 0 110px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--yellow);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 1px;
      background: var(--yellow);
      opacity: .8;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 850px;
      margin-bottom: 24px;
      font-size: clamp(52px, 9vw, 104px);
      line-height: .92;
      letter-spacing: -.065em;
      font-weight: 950;
    }

    h2 {
      margin-bottom: 14px;
      font-size: clamp(34px, 5vw, 62px);
      line-height: .98;
      letter-spacing: -.045em;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 18px;
      line-height: 1.2;
    }

    .lead {
      max-width: 720px;
      color: var(--soft);
      font-size: clamp(18px, 2vw, 22px);
      line-height: 1.65;
    }

    .muted {
      color: var(--muted);
    }

    .soft {
      color: var(--soft);
    }

    .section-space {
      margin-top: 90px;
    }

    /* =========================
       BUTTONS
       ========================= */

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }

    .btn {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 17px;
      border: 1px solid var(--line2);
      border-radius: 12px;
      background: rgba(255,255,255,.035);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 850;
      transition:
        transform var(--transition),
        border-color var(--transition),
        background var(--transition),
        color var(--transition);
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.25);
      background: rgba(255,255,255,.07);
    }

    .btn-primary {
      border-color: var(--yellow);
      background: var(--yellow);
      color: #111;
    }

    .btn-primary:hover {
      background: #ffd65e;
      border-color: #ffd65e;
    }

    .btn-small {
      min-height: 38px;
      padding-inline: 12px;
      font-size: 12px;
    }

    .btn[disabled] {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================
       HOME
       ========================= */

    .hero {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      position: relative;
      padding: 100px 0;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      top: 3%;
      right: -220px;
      border-radius: 50%;
      background: rgba(245,197,66,.055);
      filter: blur(80px);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero h1 span {
      color: var(--yellow);
    }

    .contract-box {
      max-width: 800px;
      margin-top: 42px;
      padding: 14px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.025);
    }

    .contract-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .contract-address {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--soft);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .stats {
      margin-top: 70px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .stat {
      padding: 28px 20px 28px 0;
      border-right: 1px solid var(--line);
    }

    .stat:not(:first-child) {
      padding-left: 24px;
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat-value {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -.03em;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       GRIDS / CARDS
       ========================= */

    .grid {
      display: grid;
      gap: 16px;
    }

    .g2 {
      grid-template-columns: repeat(2, minmax(0,1fr));
    }

    .g3 {
      grid-template-columns: repeat(3, minmax(0,1fr));
    }

    .g4 {
      grid-template-columns: repeat(4, minmax(0,1fr));
    }

    .card {
      min-width: 0;
      padding: 25px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.018)
        );
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .card:hover {
      border-color: var(--line2);
    }

    .card-number {
      display: block;
      margin-bottom: 30px;
      color: var(--yellow);
      font-family: ui-monospace, monospace;
      font-size: 11px;
      font-weight: 900;
    }

    .card p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .feature {
      min-height: 290px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .feature-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      margin-bottom: 25px;
      border: 1px solid var(--yellow-line);
      border-radius: 12px;
      color: var(--yellow);
      background: var(--yellow-soft);
      font-weight: 900;
    }

    .quote {
      margin: 0;
      padding: 35px;
      border-left: 2px solid var(--yellow);
      background: linear-gradient(
        90deg,
        rgba(245,197,66,.06),
        transparent
      );
      color: var(--soft);
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.35;
      letter-spacing: -.025em;
    }

    /* =========================
       MANIFESTO
       ========================= */

    .manifesto-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 60px;
      align-items: start;
    }

    .toc {
      position: sticky;
      top: 105px;
      display: grid;
      gap: 5px;
    }

    .toc button {
      border: 0;
      border-left: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 9px 12px;
      text-align: left;
      font-size: 12px;
    }

    .toc button:hover,
    .toc button.active {
      color: var(--yellow);
      border-left-color: var(--yellow);
    }

    .manifesto-principle {
      padding: 42px 0;
      border-top: 1px solid var(--line);
      scroll-margin-top: 100px;
    }

    .manifesto-principle:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .principle-number {
      margin-bottom: 15px;
      color: var(--yellow);
      font-family: ui-monospace, monospace;
      font-size: 12px;
      font-weight: 900;
    }

    .principle-title {
      margin-bottom: 14px;
      font-size: clamp(27px, 4vw, 45px);
      letter-spacing: -.04em;
    }

    .principle-text {
      max-width: 730px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 16px;
    }

    /* =========================
       TRANSPARENCY / VERIFY
       ========================= */

    .address-card {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .address-type {
      color: var(--yellow);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .address-value {
      min-height: 52px;
      display: flex;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(0,0,0,.16);
      color: var(--soft);
      word-break: break-all;
      font-family: ui-monospace, monospace;
      font-size: 11px;
    }

    .verify-list {
      display: grid;
      gap: 10px;
    }

    .verify-link {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 14px 17px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,.025);
      transition: var(--transition);
    }

    .verify-link:hover {
      border-color: var(--yellow-line);
      background: var(--yellow-soft);
      transform: translateX(2px);
    }

    .verify-name {
      font-weight: 800;
      font-size: 14px;
    }

    .verify-desc {
      color: var(--muted);
      font-size: 11px;
    }

    .arrow {
      color: var(--yellow);
      font-weight: 900;
    }

    .notice {
      margin-top: 28px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.025);
      color: var(--muted);
      font-size: 13px;
    }

    .notice strong {
      color: var(--text);
    }

    /* =========================
       VISION
       ========================= */

    .milestone {
      position: relative;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: rgba(255,255,255,.025);
    }

    .milestone::after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      right: -60px;
      bottom: -60px;
      border-radius: 50%;
      background: rgba(245,197,66,.06);
      filter: blur(10px);
    }

    .milestone-year {
      color: var(--yellow);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .milestone-value {
      margin: 18px 0 5px;
      font-size: 38px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: -.05em;
    }

    .ambition {
      margin-top: 50px;
      padding: 42px;
      border: 1px solid var(--yellow-line);
      border-radius: var(--radius);
      background:
        radial-gradient(
          circle at 90% 20%,
          rgba(245,197,66,.12),
          transparent 35%
        ),
        rgba(245,197,66,.025);
    }

    .ambition-number {
      margin: 12px 0;
      font-size: clamp(45px, 8vw, 90px);
      line-height: .95;
      font-weight: 950;
      letter-spacing: -.07em;
      color: var(--yellow);
    }

    /* =========================
       RISKS
       ========================= */

    .risk-card {
      border-top: 2px solid var(--red);
    }

    .risk-card .card-number {
      color: var(--red);
    }

    /* =========================
       FLOCK / GALLERY
       ========================= */

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 16px;
      margin-top: 35px;
    }

    .gallery-item {
      appearance: none;
      position: relative;
      min-width: 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #0a0e15;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition:
        transform var(--transition),
        border-color var(--transition);
    }

    .gallery-item:hover {
      transform: translateY(-4px);
      border-color: var(--yellow-line);
    }

    .gallery-image-wrap {
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background:
        radial-gradient(circle, rgba(245,197,66,.08), transparent 60%),
        #090d14;
    }

    .gallery-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s ease;
    }

    .gallery-item:hover .gallery-image {
      transform: scale(1.025);
    }

    .gallery-info {
      padding: 18px;
    }

    .gallery-chapter {
      margin-bottom: 6px;
      color: var(--yellow);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .gallery-title {
      margin-bottom: 5px;
      font-size: 16px;
      font-weight: 850;
    }

    .gallery-description {
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       COMMUNITY
       ========================= */

    .community-panel {
      padding: 45px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        radial-gradient(
          circle at 85% 15%,
          rgba(245,197,66,.09),
          transparent 32%
        ),
        rgba(255,255,255,.025);
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 10px;
      margin-top: 30px;
    }
