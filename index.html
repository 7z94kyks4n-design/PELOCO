g');if(smooth){coin.classList.add('resetting');coin.style.left='50%';coin.style.top='55%';coin.style.transform='translate(-50%,-50%)';setTimeout(()=>coin.classList.remove('resetting'),400);}else{coin.style.left='50%';coin.style.top='55%';coin.style.transform='translate(-50%,-50%)';}buyBtn.classList.remove('drop-ready','drop-success');buyBtn.textContent='Buy $PELOCO';hint.textContent='Drag the P coin → Buy';}function cancelDrag(){resetCoin(true);}function isOverBuy(x,y){const r=buyBtn.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}function getBuyCenter(){const ar=dragArea.getBoundingClientRect();const br=buyBtn.getBoundingClientRect();return{x:br.left+br.width/2-ar.left,y:br.top+br.height/2-ar.top};}coin.addEventListener('pointerdown',e=>{if(state!=='idle')return;e.preventDefault();pointerId=e.pointerId;state='dragging';startX=e.clientX;startY=e.clientY;coin.setPointerCapture(pointerId);hasCapture=true;coin.classList.remove('resetting','animating');coin.classList.add('dragging');hint.textContent='Drop on Buy to open Pump.fun • Esc to cancel';});coin.addEventListener('pointermove',e=>{if(state!=='dragging'||e.pointerId!==pointerId)return;const dx=e.clientX-startX,dy=e.clientY-startY;coin.style.left=(dragArea.clientWidth/2+dx)+'px';coin.style.top=(dragArea.clientHeight*0.55+dy)+'px';coin.style.transform='translate(-50%,-50%) scale(1.1)';if(isOverBuy(e.clientX,e.clientY)){buyBtn.classList.add('drop-ready');buyBtn.textContent='Drop to Buy →';}else{buyBtn.classList.remove('drop-ready');buyBtn.textContent='Buy $PELOCO';}});coin.addEventListener('pointerup',e=>{if(state!=='dragging'||e.pointerId!==pointerId)return;if(isOverBuy(e.clientX,e.clientY)){state='animating';completedTransitions.clear();const c=getBuyCenter();coin.classList.remove('dragging');coin.classList.add('animating');coin.style.left=c.x+'px';coin.style.top=c.y+'px';coin.style.transform='translate(-50%,-50%) scale(0.8)';buyBtn.classList.remove('drop-ready');buyBtn.classList.add('drop-success');buyBtn.textContent='Opening...';hint.textContent='Animating to Buy...';coin.addEventListener('transitionend',function handleTransitionEnd(e){if(e.target!==coin||state!=='animating')return;if(!expectedTransitions.has(e.propertyName))return;completedTransitions.add(e.propertyName);if(completedTransitions.size!==expectedTransitions.size)return;coin.removeEventListener('transitionend',handleTransitionEnd);state='opening';window.open(PUMP_URL,'_blank','noopener');hint.textContent='Opened! Resetting...';setTimeout(()=>{resetCoin(true);},900);});}else cancelDrag();});coin.addEventListener('pointercancel',e=>{if(e.pointerId===pointerId)cancelDrag();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state==='dragging')cancelDrag();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='dragging')cancelDrag();});window.addEventListener('blur',()=>{if(state==='dragging')cancelDrag();});window.addEventListener('pagehide',()=>{if(state==='dragging')cancelDrag();});window.addEventListener('touchcancel',()=>{if(state==='dragging')cancelDrag();});function copyCA(){navigator.clipboard.writeText(CA).then(()=>{const b=document.getElementById('contractBtn');const o=b.textContent;b.textContent='Copied!';const t=document.getElementById('toast');t.textContent='Contract Copied: '+CA.slice(0,6)+'...'+CA.slice(-4);t.classList.add('show');setTimeout(()=>{b.textContent=o;t.classList.remove('show');},2000);});}</script></body></html>
